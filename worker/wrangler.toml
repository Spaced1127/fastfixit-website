name = "fastfixit-repairs"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
# Exact origins allowed to call the endpoint. No trailing slash.
SITE_ORIGIN = "https://fastfixitelectronics.com,https://www.fastfixitelectronics.com,https://spaced1127.github.io,http://localhost:3000"

# Where repair requests are delivered. Comma-separated is allowed.
TO_EMAIL = "repairs@fastfixitelectronics.com"

# Must be a sender on a domain verified in Resend.
FROM_EMAIL = "FastFixIt Electronics <website@fastfixitelectronics.com>"

# No storefront, so this stays empty. The customer reply then says the
# shipping address follows in the shop's reply instead of printing one.
SHOP_ADDRESS = ""

# D1 is the request inbox. Create it, then uncomment this block and run
# the schema file. The form still works with email only when this is off.
[[d1_databases]]
binding = "DB"
database_name = "fastfixit-requests"
database_id = "f29f4361-419c-4353-9eaf-af7b793b319b"

# After the worker is deployed, add a custom domain in the Cloudflare
# dashboard (Workers & Pages -> your worker -> Settings -> Domains &
# Routes -> Add custom domain) or uncomment this route.
[[routes]]
pattern = "api.fastfixitelectronics.com"
custom_domain = true

# Secrets to set with `npx wrangler secret put`:
#   RESEND_API_KEY
#   TURNSTILE_SECRET
#   ADMIN_TOKEN